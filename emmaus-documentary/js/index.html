<body><canvas id="c" width="1920" height="1080"></canvas>

<script>
const C = document.getElementById('c'), X = C.getContext('2d');
let SCENE = null, DUR = 1;
// scene aliases with options
const ALIAS = {
  interior_lit: ['interior', {}], interior_gather: ['interior', { gesture: true }],
  interior_empty: ['interior', { empty: true, broken: true }], interior_out: ['interior', { empty: true, broken: true, out: true }],
};
window.setupScene = async (name, dur, extra) => {
  DUR = dur;
  const [base, opts] = ALIAS[name] || [name, {}];
  const proto = (typeof W3 !== 'undefined' && W3[base]) || (typeof WORLD !== 'undefined' && WORLD[base]) || (typeof PAINT !== 'undefined' && PAINT[base]) || (typeof BROLL !== 'undefined' && BROLL[base]);
  if (!proto) throw new Error('unknown scene ' + name);
  SCENE = Object.create(proto); await SCENE.setup(dur, Object.assign({}, opts, extra || {}));
};
window.renderFrame = (t, q = 0.93) => {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.filter = 'none';
  X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  SCENE.draw(X, t, DUR);
  return C.toDataURL('image/jpeg', q);
};
(async () => {
  await document.fonts.load('30px Cinzel'); await document.fonts.load('30px Cormorant');
  window.IMG = { painting: await loadImage('painting.jpg'), edges: await loadImage('edges.png') };
  window.READY = true;
})();
</script></body></html>
